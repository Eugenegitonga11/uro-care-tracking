<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URO-CARE Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work tool, calm and discreet (urology clinic)
   IDEA a shipped WhatsApp team inbox where the AI assistant and reception share each chat
   PICTURE the working inbox itself: chat list, live conversation, patient profile
   COLOUR white panels, near-black sidebar, violet accent like the reference, green for live, amber/red for attention
   TYPE Inter 700 + Inter
   LAYOUT laptop: sidebar | chats | conversation | profile; phone: top nav, then list or chat */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;--bg:#ffffff;--panel:#ffffff;--soft:#f7f7fa;--side:#1b1d29;--ink:#1a1b25;--mute:#6b6e7e;--line:#ebebf0;--acc:#7b5cf5;--acc2:#f1edff;--accink:#5b3fe0;--ok:#16a34a;--okbg:#e8f8ee;--warn:#c26a00;--warnbg:#fff4e0;--bad:#d92d2d;--badbg:#fdecec}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--side);color:#cfd0dc;display:flex;flex-direction:column;gap:4px;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:2px 8px 14px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cfd0dc;min-height:44px;text-align:left;width:100%}
.nav:hover{background:#ffffff12}.nav.on{background:#ffffff1c;color:#fff}
.nav .n{margin-left:auto;background:var(--acc);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:1px 8px}
.card{background:#ffffff0f;border-radius:12px;padding:14px;margin-top:auto;font-size:13px}
.card b{display:block;color:#fff;font-size:16px}
.meter{height:6px;border-radius:9px;background:#ffffff1f;margin:8px 0 10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
#pX{display:none}
.dot{width:7px;height:7px;border-radius:9px;background:currentColor}
.p-ok{background:var(--okbg);color:var(--ok)}.p-ai{background:var(--acc2);color:var(--accink)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mute{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.num{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#ffffff0f;font-size:13px}
.num .wa{width:28px;height:28px;border-radius:99px;background:#25d366;display:grid;place-items:center;color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0;margin-top:10px;border-top:1px solid #ffffff1a;font-size:13px}
.me b{color:#fff;display:block;font-size:14px}
.main{display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:24px;line-height:1.1;margin:0;letter-spacing:-.02em;margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.b1{background:var(--acc);color:#fff}.b1:hover{filter:brightness(1.08)}
.b2{border:1px solid var(--line);background:var(--panel)}.b2:hover{background:var(--soft)}
.b3{color:var(--accink)}.b3:hover{background:var(--acc2)}
.ib{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line);position:relative;background:var(--panel)}
.ib .bd{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.view{flex:1;min-height:0;display:none}.view.on{display:block}
.inbox{display:grid;grid-template-columns:310px minmax(0,1fr) 300px;height:100%}
.list{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.lh{padding:14px 16px 10px}
.lh h2{font-size:16px;margin:0 0 10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px;color:var(--mute)}
.search input{border:0;outline:0;background:none;width:100%;font-size:16px;color:var(--ink)}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.tab{border-radius:99px;padding:5px 11px;font-size:13px;font-weight:500;border:1px solid var(--line);color:var(--mute)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rows{overflow:auto;flex:1;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;border-left:3px solid transparent}
.row:hover{background:var(--soft)}.row.on{background:var(--acc2);border-left-color:var(--acc)}
.row .nm{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.row .pv{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.un{background:var(--acc);color:#fff;font-weight:700;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.av{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none;position:relative}
.av.s{width:32px;height:32px;font-size:12px}
.tag{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.conv{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ch{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch .who{margin-right:auto;display:flex;align-items:center;gap:12px}
.ch .who b{font-size:17px;display:block;line-height:1.2}
.ch .who .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;min-height:40px;padding:0 6px}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:.2s}
.sw.on i{background:var(--acc)}.sw.on i::after{left:19px}
.msgs{flex:1;overflow:auto;padding:18px clamp(12px,3vw,28px);display:flex;flex-direction:column;gap:12px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.sum h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--accink)}
.m{max-width:min(78%,560px);display:flex;flex-direction:column;gap:3px}
.m .lb{font-size:12px;color:var(--mute);display:flex;gap:8px}
.m .bb{padding:10px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.pt{align-self:flex-start}.m.pt .bb{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px}
.m.ai{align-self:flex-end;align-items:flex-end}.m.ai .bb{background:var(--acc2);color:var(--ink);border-top-right-radius:4px}
.m.st{align-self:flex-end;align-items:flex-end}.m.st .bb{background:var(--acc);color:#fff;border-top-right-radius:4px}
.m.tp .bb{font-style:italic}
.sys{align-self:center;font-size:12.5px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 12px;text-align:center}
.typing{align-self:flex-end;background:var(--acc2);border-radius:14px;padding:12px 16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:9px;background:var(--accink);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
.comp{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 12px}
.win{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.comp textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;resize:none;height:64px;background:var(--soft);outline:0}
.comp textarea:focus{border-color:var(--acc)}
.cb{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.cb .sp{flex:1}
.pop{position:absolute;bottom:52px;left:0;width:min(340px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;z-index:5;display:none}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.pop button:hover{background:var(--soft)}.pop button b{display:block;font-size:14px}
.prof{background:var(--panel);border-left:1px solid var(--line);overflow:auto}
.ph{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.ph b{display:block}.ph span{font-size:13px;color:var(--mute)}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;padding:12px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--accink);border-color:var(--acc)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--acc);color:var(--accink);background:var(--acc2);border-radius:7px;padding:2px 4px 2px 8px}
.chip button{width:20px;height:20px;display:grid;place-items:center;border-radius:5px}
.chip svg.i{width:13px;height:13px}
select,input[type=date],input[type=text]{border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px;background:var(--soft);font-size:16px;width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:8px}.note small{display:block;color:var(--mute);font-size:12px}
.empty{display:grid;place-items:center;height:100%;color:var(--mute);text-align:center;padding:30px}
#profBtn,#backBtn{display:none}
.scroll{overflow:auto;height:100%}
.wrap{max-width:1240px;padding:clamp(18px,3vw,32px) max(3vw,16px)}
.wrap h2{font-size:clamp(26px,3vw,34px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--mute);margin:0 0 20px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:13px;color:var(--mute)}.kpi b{display:block;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;line-height:1.2}.kpi small{font-size:13px;color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h3{margin:0 0 12px;font-size:16px}
.bar{display:grid;grid-template-columns:minmax(7em,11em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.bar .t{height:14px;border-radius:5px;background:var(--soft);overflow:hidden}.bar .t i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .t i.q{background:color-mix(in srgb,var(--acc) 35%,transparent)}
.heat{display:grid;grid-template-columns:3em repeat(10,minmax(0,1fr));gap:3px;font-size:12px;color:var(--mute)}
.heat div{height:26px;border-radius:4px;background:var(--acc)}.heat span{display:grid;place-items:center}
.ins{font-size:15px}.ins p{margin:0 0 8px}
.qlist .note{display:flex;gap:10px;align-items:flex-start}.qlist .note div{flex:1}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.set p{margin:0;font-size:13px;color:var(--mute)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--side);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #0004;transform:translateY(140%);transition:.3s;z-index:40;max-width:calc(100vw - 36px)}
.toast.on{transform:none}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}
.dlg{background:var(--panel);border-radius:16px;padding:20px;width:min(420px,100%)}
.dlg h3{margin:0 0 4px}.dlg p{margin:0 0 14px;color:var(--mute);font-size:14px}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;text-align:left}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.adref{font-size:13px;background:var(--acc2);color:var(--accink);border-radius:8px;padding:6px 9px;margin-top:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tbl th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}.tbl tr.tot td{font-weight:700;background:var(--soft)}
.tbl input{height:36px;width:8em;text-align:right;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:16px;background:#fff}
.sv{display:grid;grid-template-columns:minmax(8em,13em) minmax(0,1fr);gap:4px 12px;align-items:center;font-size:14px;margin:10px 0}
.sv .t{display:grid;gap:3px}.sv .t i{display:block;height:12px;border-radius:4px;white-space:nowrap}
.sv .t i.s{background:#c9cbd6}.sv .t i.v{background:var(--acc)}
.sv small{font-size:12px;color:var(--mute)}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-bottom:4px}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.form3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media(max-width:700px){.form3{grid-template-columns:1fr}}
.sample{font-size:13px;color:var(--mute);margin-top:16px}
/* WhatsApp Desktop light look for the chat list and conversation */
.list{background:#fff}
.lh h2{font-size:22px;color:#111b21}
.list .search{background:#f0f2f5;border:0;border-radius:8px;height:38px;color:#54656f}
.list .tab{background:#f0f2f5;border:0;color:#54656f;padding:6px 12px}
.list .tab.on{background:#d9fdd3;color:#008069}
.list .rows{border-top:0}
.row{grid-template-columns:49px minmax(0,1fr);gap:13px;align-items:center;padding:0 0 0 13px;border:0;border-left:0}
.row.on{background:#f0f2f5;border-left-color:transparent}.row:hover{background:#f5f6f6}
.row .av{width:49px;height:49px;font-size:16px}
.rb{border-bottom:1px solid #e9edef;padding:11px 15px 11px 0}
.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .nm{font-size:16px;font-weight:400;color:#111b21}
.rt{font-size:12px;color:#667781;white-space:nowrap}.rt.g{color:#1fa855;font-weight:500}
.row .pv{font-size:14px;color:#667781;display:flex;align-items:center;gap:3px}
.row .pv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un{background:#25d366;color:#fff}
.r3{margin-top:5px}.r3 .pill{font-size:12px;padding:0 8px}
.conv{background-color:#efeae2;background-image:radial-gradient(#d6cfc2 1px,transparent 1.3px);background-size:22px 22px}
.ch{background:#f0f2f5;border-bottom:1px solid #d1d7db}
.ch .b1,.comp .b1{background:#00a884}
.msgs{gap:2px;padding:16px 6%}
.m{display:block;max-width:min(65%,560px);margin-top:6px}
.m.in{align-self:flex-start}.m.out{align-self:flex-end}
.m .bb{position:relative;background:#fff;color:#111b21;border:0;border-radius:7.5px;padding:6px 9px 8px;font-size:14.2px;line-height:19px;box-shadow:0 1px .5px #0b141a21}
.m.out .bb{background:#d9fdd3}
.m.in .bb{border-top-left-radius:0}.m.out .bb{border-top-right-radius:0}
.m .bb::before{content:"";position:absolute;top:0;width:8px;height:13px;background:inherit}
.m.in .bb::before{left:-8px;clip-path:polygon(0 0,100% 0,100% 100%)}
.m.out .bb::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.who{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-bottom:2px;white-space:normal}
.who.ai{color:#6c4cf5}.who.st{color:#008069}.who svg.i{width:13px;height:13px}
.tm{float:right;display:inline-flex;align-items:center;gap:3px;margin:8px 0 -5px 12px;font-size:11px;color:#667781;white-space:nowrap}
.tk{width:16px;height:11px;fill:none;stroke:#53bdeb;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.day{align-self:center;background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:7.5px;box-shadow:0 1px .5px #0b141a21;margin:10px 0 4px}
.conv .sys{background:#fff;border:0;border-radius:7.5px;box-shadow:0 1px .5px #0b141a21;color:#54656f;margin:6px 0}
.conv .sum{align-self:center;max-width:min(92%,620px);background:#ffeecd;border:0;border-radius:7.5px;color:#54656f;font-size:13.5px;box-shadow:0 1px .5px #0b141a21}
.conv .sum h3{color:#54656f}
.conv .typing{background:#d9fdd3;border-radius:7.5px;box-shadow:0 1px .5px #0b141a21}.conv .typing i{background:#667781}
.comp{background:#f0f2f5;border-top:0}
.comp textarea{background:#fff;border:0;border-radius:8px;height:46px;padding:12px}
.comp .b3{color:#54656f}.comp .b3:hover{background:#e4e6e9}
@media(max-width:1200px){.inbox{grid-template-columns:280px minmax(0,1fr)}.prof{display:none;position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);z-index:30;box-shadow:-10px 0 30px #0003}.app.sp .prof{display:block}#profBtn,#pX{display:inline-grid}}
@media(max-width:920px){.app{grid-template-columns:68px minmax(0,1fr)}.side .tx,.card,.num,.me div,.brand span{display:none}.nav{justify-content:center;padding:10px}.nav .n{position:absolute;margin:0;transform:translate(14px,-12px);font-size:11px}.nav{position:relative}.grid2{grid-template-columns:1fr}}

<div class="grid2"><div class="box"><h3>Spend against revenue, by campaign</h3><div class="lg"><span style="--c:#c9cbd6">Spend</span><span style="--c:var(--acc)">Revenue entered</span></div>${sel.map(m=>`<div class="sv"><span><b>${esc(m.name)}</b><br><small>${esc(m.src)} · ${ret(m.rev,m.spend)}</small></span><div class="t"><i class="s" style="width:${m.spend/mx*100}%"></i><i class="v" style="width:${m.rev/mx*100}%"></i></div></div>`).join('')}</div>
<div class="box"><h3>Amounts still to enter</h3>${pend.length?pend.map(c=>`<div class="note" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(c.name)}</b><small>${esc(c.src)} · ${esc(campName(c))} · ${esc(c.lead)}</small></div><button class="btn b2" data-open="${c.id}">Open chat</button></div>`).join(''):'<p class="hint">All booked ad patients have an amount entered.</p>'}<p class="hint">Patients who booked from an ad but have no amount yet. Reception enters it in the patient profile after the visit.</p></div>
<div class="box"><h3>Add a campaign</h3><div class="form3"><label>Name<input type="text" id="cn" placeholder="e.g. Prostate · Dec"></label><label>Source<select id="cs"><option ${F!=='Google Ads'?'selected':''}>Meta Ads</option><option ${F==='Google Ads'?'selected':''}>Google Ads</option></select></label><label>Spend (KES)<input type="text" id="cv" inputmode="numeric" placeholder="20000"></label><button class="btn b1" id="cadd">${ic('plus')}Add</button></div></div>
<div class="box ins"><h3>How patients are matched to ads</h3><p><b>Meta click-to-WhatsApp ads:</b> WhatsApp sends the ad's ID and headline with the patient's first message, so the chat is tagged automatically.</p><p><b>Google Ads and the website:</b> the WhatsApp link pre-fills a short code (for example "ref G1"), which the webhook reads and removes.</p><p><b>Everyone else:</b> reception asks how they heard about URO-CARE and picks the source in the profile.</p></div></div>
<p class="sample">Earlier figures this month are sample data. Chats in the inbox, sources you change and amounts you enter update this page live.</p>`;
$('ads').querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{S.adf=b.dataset.af;adsv()});
$('ads').querySelectorAll('.tbl input').forEach(i=>i.onchange=()=>{const m=camps.find(x=>x.id===i.dataset.id);m.spend=parseInt(i.value.replace(/[^0-9]/g,''),10)||0;adsv()});
$('ads').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.open;S.pt='profile';go('inbox');$('app').classList.add('op','sp');render()});
$('cadd').onclick=()=>{const n=$('cn').value.trim(),v=parseInt($('cv').value.replace(/[^0-9]/g,''),10)||0;if(!n)return $('cn').focus();camps.push({id:'x'+now(),name:n,src:$('cs').value,spend:v,b:[0,0,0,0]});adsv();toast(ic('check')+'Campaign added. Pick it in a patient profile to count them.')}}
function qrv(){$('qr').innerHTML=`<h2>Quick replies</h2><p class="lead">Saved answers reception can drop into any chat from the composer.</p><div class="box qlist">${qr.map((q,i)=>`<div class="note"><div><b>${esc(q.t)}</b><br>${esc(q.x)}</div><button class="ib" data-i="${i}" aria-label="Delete ${esc(q.t)}">${ic('x')}</button></div>`).join('')}<input type="text" id="qt" placeholder="Title, e.g. Parking" style="margin:8px 0" aria-label="Quick reply title"><textarea id="qx" style="width:100%;height:70px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--soft);font-size:16px" placeholder="Reply text" aria-label="Quick reply text"></textarea><button class="btn b1" id="qadd" style="margin-top:8px">${ic('plus')}Add quick reply</button></div>`;
$('qr').querySelectorAll('.ib').forEach(b=>b.onclick=()=>{qr.splice(+b.dataset.i,1);qrv()});$('qadd').onclick=()=>{const t=$('qt').value.trim(),x=$('qx').value.trim();if(t&&x){qr.push({t,x});qrv()}}}
function cfgv(){const R=[['ai','AI answers typed questions','Uses the same knowledge base as the website assistant. Off sends every message straight to reception.'],['book','Hand over when a patient wants to book','The AI collects the request and reception confirms the time.'],['strip','Remove phone numbers before AI analysis','Keeps patient numbers out of the AI provider\'s logs.'],['hours','Out-of-hours message only','Outside clinic hours, the AI answers and tells patients reception replies from 9 am.']];
$('cfg').innerHTML=`<h2>AI settings</h2><p class="lead">These switches change how the simulation behaves. Try turning off the AI, then press Simulate patient message.</p><div class="box">${R.map(([k,t,d])=>`<div class="set"><div><b>${t}</b><p>${d}</p></div><button class="sw ${cfg[k]?'on':''}" data-k="${k}" aria-pressed="${cfg[k]}" aria-label="${t}"><i></i></button></div>`).join('')}<div class="set" style="border:0"><div><b>Urgent words</b><p>Blood, bleeding, cannot pass urine, severe pain, fever. These always alert reception and tell the patient to call or seek emergency care.</p></div></div></div>`;
$('cfg').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{cfg[b.dataset.k]=!cfg[b.dataset.k];cfgv()})}
$('lg').innerHTML=ic('cross');$('waI').innerHTML=ic('chat');$('sI').innerHTML=ic('search');$('backBtn').innerHTML=ic('back');$('profBtn').innerHTML=ic('user');$('simBtn').innerHTML=ic('play')+'<span class="tx">Simulate patient message</span>';
$('backBtn').onclick=()=>$('app').classList.remove('op');$('profBtn').onclick=()=>$('app').classList.toggle('sp');$('simBtn').onclick=simulate;
$('bell').onclick=()=>{go('inbox');S.f='rec';$('app').classList.remove('op');render()};
$('q').oninput=e=>{S.q=e.target.value;list()};
document.addEventListener('click',e=>{const p=$('pop');if(p&&!e.target.closest('#pop')&&!e.target.closest('#qrb'))p.classList.remove('on')});
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('on')};
setInterval(()=>{if(S.v==='inbox'){list();const w=document.querySelector('.win');const c=cur();if(w&&c)w.innerHTML=win(c).h}},30000);
nav();render();
}
</script>
</body>
</html>
